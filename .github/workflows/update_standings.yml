name: Update F1 Data

on:
  # 1. Точный запуск от внешнего будильника cron-job.org
  repository_dispatch:
    types: [cron_trigger]
  # 2. Запуск при твоих пушах
  push:
    branches: [ "main", "master" ]
  # 3. Ручной запуск кнопкой
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск скрипта обновления турнирной таблицы
        run: python fetch_standings.py

      - name: Запуск скрипта обновления расписания
        run: python fetch_schedule.py

      - name: Запуск скрипта обновления новостной ленты
        run: python fetch_news.py

      - name: Запуск скрипта обновления результатов сессий
        run: python fetch_results.py

      - name: Сохранение изменений обратно в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/v1/*.json
          if ! git diff --staged --quiet; then
            git fetch origin main
            git reset --soft origin/main
            git commit -m "Auto-sync F1 data & status heartbeat"
            git push origin main
          fi