name: Aggregate Fan Votes

on:
  repository_dispatch:
    types: [user_vote]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: votes-${{ github.event.client_payload.meetingKey }}
  cancel-in-progress: false

jobs:
  process_vote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Up to Date
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Process Fan Vote Payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const payload = context.payload ? context.payload.client_payload : null;
            
            if (!payload || payload.meetingKey === undefined || payload.meetingKey === null || !payload.clientId) {
              console.log('No valid user_vote payload provided.');
              return;
            }

            const meetingKey = payload.meetingKey;
            const driverNumber = payload.driverNumber;
            const clientId = payload.clientId;
            const action = payload.action || (driverNumber === 0 ? 'remove' : 'vote');

            console.log(`Processing ${action} for meeting: ${meetingKey}, driver: ${driverNumber}, client: ${clientId}`);

            // 1. Ensure directories exist
            const dataDir = 'data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });

            const publicVotesDir = 'api/v1/votes';
            if (!fs.existsSync(publicVotesDir)) fs.mkdirSync(publicVotesDir, { recursive: true });

            // 2. Read raw votes file
            const rawFile = `${dataDir}/votes_raw_${meetingKey}.json`;
            let rawData = {};
            if (fs.existsSync(rawFile)) {
              try {
                rawData = JSON.parse(fs.readFileSync(rawFile, 'utf8'));
              } catch (e) {
                console.error('Error parsing raw votes file', e);
              }
            }

            // 3. Record or remove vote (1 vote per clientId per meeting)
            if (action === 'remove' || driverNumber === 0) {
              delete rawData[clientId];
            } else if (driverNumber) {
              rawData[clientId] = driverNumber;
            }
            fs.writeFileSync(rawFile, JSON.stringify(rawData, null, 2));

            // 4. Aggregate vote totals
            const counts = {};
            let total = 0;
            for (const id in rawData) {
              const driver = String(rawData[id]);
              counts[driver] = (counts[driver] || 0) + 1;
              total++;
            }

            const votesResponse = {
              meeting_key: Number(meetingKey),
              total_votes: total,
              votes: counts
            };

            // 5. Save public aggregated votes JSON
            const publicFile = `${publicVotesDir}/${meetingKey}.json`;
            fs.writeFileSync(publicFile, JSON.stringify(votesResponse, null, 2));
            console.log(`Updated ${publicFile} with total votes: ${total}`);

      - name: Save and Commit Votes
        run: |
          git add data/*.json
          git add api/v1/votes/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-sync fan votes [meeting ${{ github.event.client_payload.meetingKey }}]"
          
          for i in {1..5}; do
            if git push origin main; then
              echo "Successfully pushed votes."
              exit 0
            fi
            echo "Push failed, pulling with rebase (attempt $i)..."
            git pull --rebase origin main || true
            sleep 2
          done
          echo "Failed to push votes after retries."
          exit 1
